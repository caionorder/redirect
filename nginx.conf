upstream redirect_backend {
    server 127.0.0.1:6969;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    server_name redirect.belnk.in ~^(redirect|security|link)\\..+\\..+$;

    # Logs para debug
    access_log /var/log/nginx/redirect.access.log buffer=64k flush=5s;
    error_log /var/log/nginx/redirect.error.log warn;

    # Otimizações para TTFB
    proxy_buffering off;
    keepalive_requests 1000;
    keepalive_timeout 65;
    tcp_nodelay on;
    tcp_nopush on;

    # Cache de arquivos estáticos
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORREÇÃO PRINCIPAL: Captura o path e adiciona ao prefixo
    location / {
        proxy_pass http://redirect_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Otimizações de proxy para TTFB
        proxy_buffer_size 32k;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    # Compressão otimizada
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 2;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "MSIE [1-6]\\.";


    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/redirect.belnk.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/redirect.belnk.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = redirect.belnk.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



    listen 80;
    server_name redirect.belnk.in ~^(redirect|security|link)\\..+\\..+$;
    return 404; # managed by Certbot


}
